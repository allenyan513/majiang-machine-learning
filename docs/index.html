<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>麻将机器学习教程</title>
<style>
  :root {
    --bg:#ffffff; --fg:#1f2328; --muted:#656d76; --line:#d7dce2; --sidebar:#f6f8fa;
    --accent:#1f5fa8; --accent-soft:#eaf1fa; --code-bg:#0d1117; --code-fg:#e6edf3;
    --kw:#ff7b72; --str:#a5d6ff; --com:#8b949e; --num:#79c0ff; --fn:#d2a8ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0f1115; --fg:#e3e6ea; --muted:#99a1ab; --line:#2b313a; --sidebar:#151920;
      --accent:#6aa9ff; --accent-soft:#18243a; --code-bg:#161b22; --code-fg:#e6edf3;
    }
  }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body {
    margin:0; background:var(--bg); color:var(--fg);
    font:16px/1.75 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
         "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a { color:var(--accent); text-decoration:none; }
  a:hover { text-decoration:underline; }

  /* ---------- layout ---------- */
  .wrap { display:grid; grid-template-columns:282px minmax(0,1fr); min-height:100vh; }
  aside {
    background:var(--sidebar); border-right:1px solid var(--line);
    position:sticky; top:0; height:100vh; overflow-y:auto; padding:22px 0 40px;
  }
  .brand { padding:0 22px 16px; border-bottom:1px solid var(--line); margin-bottom:10px; }
  .brand h1 { margin:0 0 5px; font-size:17px; letter-spacing:.02em; }
  .brand p { margin:0; font-size:12.5px; color:var(--muted); line-height:1.55; }
  .brand .repo { display:inline-block; margin-top:9px; font-size:12px; }

  nav ol { list-style:none; margin:0; padding:0; }
  nav li a {
    display:block; padding:7px 20px 7px 48px; font-size:14px; color:var(--fg);
    position:relative; border-left:3px solid transparent; line-height:1.45;
  }
  nav li a .num {
    position:absolute; left:20px; top:9px; font-size:11px; color:var(--muted);
    font-variant-numeric:tabular-nums; letter-spacing:.04em;
  }
  nav li a:hover { background:var(--accent-soft); text-decoration:none; }
  nav li a.on { background:var(--accent-soft); border-left-color:var(--accent);
                font-weight:600; color:var(--accent); }
  nav li a.on .num { color:var(--accent); }
  nav .part { padding:17px 22px 5px; font-size:11px; letter-spacing:.12em;
              text-transform:uppercase; color:var(--muted); }

  main { min-width:0; }
  article { max-width:830px; margin:0 auto; padding:46px 30px 90px; }

  /* ---------- typography ---------- */
  article h1 { font-size:29px; line-height:1.35; margin:0 0 24px; padding-bottom:14px;
               border-bottom:1px solid var(--line); }
  article h2 { font-size:21px; margin:46px 0 14px; }
  article h3 { font-size:17px; margin:30px 0 10px; }
  article p { margin:0 0 16px; }
  article ul, article ol { margin:0 0 18px; padding-left:26px; }
  article li { margin:6px 0; }
  article blockquote {
    margin:0 0 24px; padding:11px 16px; border-left:3px solid var(--accent);
    background:var(--accent-soft); font-size:14px; border-radius:0 6px 6px 0;
  }
  article blockquote p { margin:0 0 6px; }
  article blockquote p:last-child { margin:0; }
  article hr { border:0; border-top:1px solid var(--line); margin:34px 0; }
  .tablewrap { overflow-x:auto; margin:0 0 20px; }
  article table { border-collapse:collapse; width:100%; font-size:14.5px; }
  article th, article td { border:1px solid var(--line); padding:7px 12px; text-align:left;
                           vertical-align:top; }
  article th { background:var(--sidebar); font-weight:600; white-space:nowrap; }
  article code {
    font-family:"SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    font-size:13.5px; background:var(--accent-soft); padding:2px 5px; border-radius:4px;
  }
  article pre {
    background:var(--code-bg); border:1px solid var(--line); border-radius:8px;
    padding:15px 17px; overflow-x:auto; margin:0 0 20px;
  }
  article pre code { background:none; padding:0; font-size:13px; line-height:1.65; color:var(--code-fg); }
  .k { color:var(--kw); } .s { color:var(--str); } .c { color:var(--com); font-style:italic; }
  .n { color:var(--num); } .f { color:var(--fn); }
  article img { max-width:100%; }
  .task { list-style:none; margin-left:-20px; }

  /* ---------- pager ---------- */
  .pager { display:flex; justify-content:space-between; gap:14px; margin-top:58px;
           padding-top:22px; border-top:1px solid var(--line); font-size:14px; }
  .pager a { max-width:48%; }
  .pager .lbl { display:block; font-size:11px; color:var(--muted);
                letter-spacing:.08em; text-transform:uppercase; }

  .toolbar { display:none; }
  .err { padding:18px; border:1px solid var(--line); border-radius:8px; background:var(--sidebar); }
  .err pre { margin:10px 0; }

  /* ---------- mobile ---------- */
  @media (max-width: 860px) {
    .wrap { grid-template-columns:1fr; }
    aside { position:static; height:auto; border-right:0; border-bottom:1px solid var(--line);
            padding:16px 0 10px; }
    aside.collapsed nav { display:none; }
    .toolbar { display:flex; justify-content:space-between; align-items:center;
               gap:10px; padding:0 18px 8px; }
    .toolbar span { font-size:13px; color:var(--muted); overflow:hidden;
                    text-overflow:ellipsis; white-space:nowrap; }
    .toolbar button { background:none; border:1px solid var(--line); color:var(--fg);
                      border-radius:6px; padding:5px 12px; font-size:13px; cursor:pointer;
                      flex:none; }
    article { padding:26px 18px 64px; }
    article h1 { font-size:24px; }
    article h2 { font-size:19px; margin-top:36px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <aside id="side" class="collapsed">
    <div class="brand">
      <h1>麻将机器学习</h1>
      <p>从麻将引擎到强化学习，一步步写一个会打牌的 AI</p>
      <a class="repo" href="https://github.com/allenyan513/majiang-machine-learning">GitHub 仓库 →</a>
    </div>
    <div class="toolbar">
      <span id="cur-label">目录</span>
      <button id="toggle">目录</button>
    </div>
    <nav id="nav"></nav>
  </aside>
  <main><article id="content">加载中…</article></main>
</div>

<script>
/* ------------------------------------------------------------------ 章节表 */
const CHAPTERS = [
  { file: "00-overview.md",   title: "全景：你要造的东西",   part: "开始" },
  { file: "01-tiles.md",      title: "把麻将变成数组",       part: "第一部分 · 引擎" },
  { file: "02-win.md",        title: "胡牌判定" },
  { file: "03-shanten.md",    title: "向听数与牌效率" },
  { file: "04-game.md",       title: "游戏状态机" },
  { file: "05-agents.md",     title: "规则 bot 与评估框架", part: "第二部分 · 机器学习" },
  { file: "06-features.md",   title: "特征工程" },
  { file: "07-supervised.md", title: "监督学习" },
  { file: "08-rl-theory.md",  title: "强化学习原理",         part: "第三部分 · 强化学习" },
  { file: "09-ppo.md",        title: "PPO 实战" },
  { file: "10-evaluation.md", title: "评估与诚实的失败" },
  { file: "11-viz.md",        title: "可视化与人机对战",     part: "第四部分 · 收尾" },
  { file: "12-next.md",       title: "从这里往哪走" },
  { file: "13-defense.md",    title: "改进老师：规则决定了上限", part: "第五部分 · 撞墙与转向" },
  { file: "14-riichi-rules.md", title: "日本立直麻将：规则研究" },
];

/* ------------------------------------------------- 极简 Markdown 渲染器
   只支持本教程用到的语法，因此不需要任何外部依赖：页面离线也能读。      */
const esc = (t) => t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

const PY_KW = /\b(def|class|return|if|elif|else|for|while|in|not|and|or|import|from|as|with|try|except|raise|assert|lambda|None|True|False|self|yield|pass|break|continue|is|global|await|async)\b/g;

function highlight(code, lang) {
  const out = esc(code);
  // 先切出字符串和注释，剩下的部分才套关键字规则，避免嵌套破坏
  const parts = out.split(/("""[\s\S]*?"""|"[^"\n]*"|'[^'\n]*'|#[^\n]*)/g);
  return parts
    .map((chunk, i) => {
      if (i % 2 === 1) {
        const cls = chunk.startsWith("#") ? "c" : "s";
        return '<span class="' + cls + '">' + chunk + "</span>";
      }
      if (lang === "text") return chunk;
      return chunk
        .replace(PY_KW, '<span class="k">$1</span>')
        .replace(/\b(\d+\.?\d*(?:e-?\d+)?)\b/g, '<span class="n">$1</span>');
    })
    .join("");
}

function inline(text) {
  const codes = [];
  let t = esc(text).replace(/`([^`]+)`/g, (_, c) => {
    codes.push(c);
    return "\uE000" + (codes.length - 1) + "\uE000";
  });
  t = t
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  return t.replace(/\uE000(\d+)\uE000/g, (_, i) => "<code>" + codes[+i] + "</code>");
}

function render(md) {
  const lines = md.replace(/\r\n/g, "\n").split("\n");
  const html = [];
  let i = 0;

  const isTableSep = (s) => /^\s*\|?[\s:|-]*-[\s:|-]*\|?\s*$/.test(s) && s.includes("-");
  const cells = (row) =>
    row.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|").map((c) => c.trim());

  while (i < lines.length) {
    const line = lines[i];

    if (!line.trim()) { i++; continue; }

    // 代码块
    if (line.startsWith("```")) {
      const lang = line.slice(3).trim();
      const buf = [];
      i++;
      while (i < lines.length && !lines[i].startsWith("```")) buf.push(lines[i++]);
      i++;
      html.push("<pre><code>" + highlight(buf.join("\n"), lang) + "</code></pre>");
      continue;
    }

    // 标题
    const h = line.match(/^(#{1,4})\s+(.*)$/);
    if (h) {
      const lvl = h[1].length;
      html.push("<h" + lvl + ">" + inline(h[2]) + "</h" + lvl + ">");
      i++;
      continue;
    }

    // 分隔线
    if (/^---+$/.test(line.trim())) { html.push("<hr>"); i++; continue; }

    // 表格
    if (line.includes("|") && i + 1 < lines.length && isTableSep(lines[i + 1])) {
      const head = cells(line);
      i += 2;
      const rows = [];
      while (i < lines.length && lines[i].includes("|") && lines[i].trim()) rows.push(cells(lines[i++]));
      html.push(
        '<div class="tablewrap"><table><thead><tr>' +
          head.map((c) => "<th>" + inline(c) + "</th>").join("") +
          "</tr></thead><tbody>" +
          rows.map((r) => "<tr>" + r.map((c) => "<td>" + inline(c) + "</td>").join("") + "</tr>").join("") +
          "</tbody></table></div>"
      );
      continue;
    }

    // 引用
    if (line.startsWith(">")) {
      const buf = [];
      while (i < lines.length && lines[i].startsWith(">")) buf.push(lines[i++].replace(/^>\s?/, ""));
      html.push("<blockquote>" + buf.filter((s) => s.trim()).map((s) => "<p>" + inline(s) + "</p>").join("") + "</blockquote>");
      continue;
    }

    // 无序列表 / 任务列表
    if (/^[-*]\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^[-*]\s+/.test(lines[i])) {
        let body = lines[i++].replace(/^[-*]\s+/, "");
        const task = body.match(/^\[( |x|X)\]\s+(.*)$/);
        items.push(
          task
            ? '<li class="task"><input type="checkbox" disabled' +
              (task[1] === " " ? "" : " checked") + "> " + inline(task[2]) + "</li>"
            : "<li>" + inline(body) + "</li>"
        );
      }
      html.push("<ul>" + items.join("") + "</ul>");
      continue;
    }

    // 有序列表
    if (/^\d+\.\s+/.test(line)) {
      const items = [];
      const start = parseInt(line, 10);
      while (i < lines.length && /^\d+\.\s+/.test(lines[i]))
        items.push("<li>" + inline(lines[i++].replace(/^\d+\.\s+/, "")) + "</li>");
      html.push('<ol start="' + start + '">' + items.join("") + "</ol>");
      continue;
    }

    // 段落
    const buf = [];
    while (
      i < lines.length && lines[i].trim() &&
      !lines[i].startsWith("```") && !/^#{1,4}\s/.test(lines[i]) &&
      !/^[-*]\s/.test(lines[i]) && !/^\d+\.\s/.test(lines[i]) && !lines[i].startsWith(">")
    ) buf.push(lines[i++]);
    html.push("<p>" + inline(buf.join(" ")) + "</p>");
  }
  return html.join("\n");
}

/* ------------------------------------------------------------------ 页面 */
const $ = (id) => document.getElementById(id);
const nav = $("nav");
const content = $("content");
const slugOf = (file) => file.replace(/\.md$/, "");

let ol = null;
for (const ch of CHAPTERS) {
  if (ch.part) {
    const head = document.createElement("div");
    head.className = "part";
    head.textContent = ch.part;
    nav.appendChild(head);
    ol = document.createElement("ol");
    nav.appendChild(ol);
  }
  const li = document.createElement("li");
  const a = document.createElement("a");
  a.href = "#" + slugOf(ch.file);
  const num = document.createElement("span");
  num.className = "num";
  num.textContent = ch.file.slice(0, 2);
  a.appendChild(num);
  a.appendChild(document.createTextNode(ch.title));
  a.dataset.file = ch.file;
  li.appendChild(a);
  ol.appendChild(li);
}

const cache = new Map();

async function load(file) {
  const idx = CHAPTERS.findIndex((c) => c.file === file);
  if (idx < 0) return load(CHAPTERS[0].file);

  let md = cache.get(file);
  if (md === undefined) {
    try {
      const res = await fetch(file, { cache: "no-cache" });
      if (!res.ok) throw new Error(res.status + " " + res.statusText);
      md = await res.text();
      cache.set(file, md);
    } catch (e) {
      content.innerHTML =
        '<div class="err"><h1>没能加载 ' + file + "</h1>" +
        "<p>用浏览器直接打开本地 HTML 文件时，读取同目录的 .md 会被同源策略拦下。" +
        "起一个静态服务器再访问：</p>" +
        "<pre><code>python3 -m http.server 8080 --directory docs</code></pre>" +
        "<p>然后打开 <code>http://localhost:8080/</code>。" +
        "也可以直接在 GitHub 上读 Markdown 源文件。</p>" +
        '<p style="color:var(--muted);font-size:13px">' + esc(String(e)) + "</p></div>";
      return;
    }
  }

  content.innerHTML = render(md);

  // 章节之间的 .md 链接改写成本页的 hash 路由
  content.querySelectorAll("a[href$='.md']").forEach((a) => {
    const href = a.getAttribute("href");
    if (!/^https?:/.test(href)) a.setAttribute("href", "#" + slugOf(href));
  });

  const prev = CHAPTERS[idx - 1], next = CHAPTERS[idx + 1];
  const pager = document.createElement("div");
  pager.className = "pager";
  pager.innerHTML =
    (prev ? '<a href="#' + slugOf(prev.file) + '"><span class="lbl">上一章</span>' + prev.title + "</a>" : "<span></span>") +
    (next ? '<a href="#' + slugOf(next.file) + '" style="text-align:right"><span class="lbl">下一章</span>' + next.title + "</a>" : "<span></span>");
  content.appendChild(pager);

  nav.querySelectorAll("a").forEach((a) => a.classList.toggle("on", a.dataset.file === file));
  $("cur-label").textContent = CHAPTERS[idx].title;
  document.title = CHAPTERS[idx].title + " · 麻将机器学习教程";
  $("side").classList.add("collapsed");
  window.scrollTo(0, 0);
}

function fromHash() {
  const slug = location.hash.replace(/^#/, "");
  const ch = CHAPTERS.find((c) => slugOf(c.file) === slug);
  load(ch ? ch.file : CHAPTERS[0].file);
}

window.addEventListener("hashchange", fromHash);
$("toggle").addEventListener("click", () => $("side").classList.toggle("collapsed"));
document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey || /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  const idx = CHAPTERS.findIndex((c) => slugOf(c.file) === location.hash.replace(/^#/, ""));
  if (e.key === "ArrowLeft" && idx > 0) location.hash = slugOf(CHAPTERS[idx - 1].file);
  if (e.key === "ArrowRight" && idx >= 0 && idx < CHAPTERS.length - 1)
    location.hash = slugOf(CHAPTERS[idx + 1].file);
});
fromHash();
</script>
</body>
</html>
