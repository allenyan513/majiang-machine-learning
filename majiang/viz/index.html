<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>麻将 AI 观战</title>
<style>
  :root { --bg:#1d1f24; --panel:#2a2d34; --line:#3a3e47; --txt:#e8e6e1; --muted:#9a9da6;
          --m:#c0392b; --s:#1e8449; --p:#1f5fa8; --z:#222; --felt:#7a1f2b; --felt2:#5c1620; --gold:#e6b422; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.4 -apple-system,"PingFang SC",sans-serif; background:var(--bg); color:var(--txt); }
  header { display:flex; gap:10px; align-items:center; padding:8px 14px; background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header label { color:var(--muted); font-size:13px; }
  header input, header select { background:#1a1c21; color:var(--txt); border:1px solid var(--line); border-radius:4px; padding:3px 6px; }
  header input[type=number] { width:64px; }
  button { padding:5px 12px; border:1px solid #555; background:#3a3e47; color:var(--txt); border-radius:4px; cursor:pointer; }
  button:hover { background:#4a4f5a; }
  button.primary { background:#2e6bd6; border-color:#2e6bd6; }
  button.danger { background:#b03a2e; border-color:#b03a2e; }
  #status { margin-left:auto; color:var(--muted); }
  main { display:grid; grid-template-columns: 800px minmax(320px,1fr); gap:16px; padding:12px; align-items:start; }

  /* ---------- 牌桌 ---------- */
  .table { position:relative; width:800px; height:700px; border-radius:18px; padding:8px;
           background: radial-gradient(ellipse at center, var(--felt) 0%, var(--felt2) 100%);
           box-shadow: inset 0 0 0 6px #3b1a10, inset 0 0 0 9px #8a5a2b, 0 8px 30px rgba(0,0,0,.5);
           display:grid; grid-template-columns:160px 1fr 160px; grid-template-rows:165px 1fr 175px;
           grid-template-areas: "left top right" "left center right" "left bottom right"; }
  .seat { position:relative; display:flex; }
  .seat.top { grid-area:top; flex-direction:column; align-items:center; justify-content:flex-start; padding-top:30px; gap:6px; }
  .seat.bottom { grid-area:bottom; flex-direction:column; align-items:center; justify-content:flex-end; padding-bottom:8px; gap:6px; }
  .seat.left { grid-area:left; flex-direction:row; align-items:center; justify-content:flex-start; gap:8px; padding-left:6px; }
  .seat.right { grid-area:right; flex-direction:row-reverse; align-items:center; justify-content:flex-start; gap:8px; padding-right:6px; }
  .center { grid-area:center; display:flex; align-items:center; justify-content:center; }
  .hub { width:190px; height:190px; border-radius:12px; background:#151515; border:3px solid var(--gold);
         display:grid; grid-template-columns:36px 1fr 36px; grid-template-rows:36px 1fr 36px; place-items:center; color:#ddd; }
  .hub .wall { font-size:40px; font-weight:800; color:#4dd0e1; line-height:1; }
  .hub .sub { font-size:11px; color:#999; margin-top:4px; text-align:center; }
  .hub .wind { font-size:16px; font-weight:700; color:#666; }
  .hub .wind.on { color:var(--gold); text-shadow:0 0 8px var(--gold); }

  .plate { position:absolute; display:flex; gap:6px; align-items:center; font-size:12px; color:#f1e7d3; white-space:nowrap;
           background:rgba(0,0,0,.35); padding:2px 8px; border-radius:10px; }
  .seat.bottom .plate { left:14px; top:6px; }
  .seat.top .plate { left:14px; top:4px; }
  .seat.left .plate, .seat.right .plate { top:8px; flex-direction:column; align-items:flex-start; gap:0; }
  .seat.left .plate { left:8px; }
  .seat.right .plate { right:8px; }
  .plate b { font-size:13px; }
  .plate .tag { font-size:10px; padding:0 5px; border-radius:3px; background:#444; }
  .plate .tag.nn { background:#1f5fa8; } .plate .tag.rule { background:#1e8449; } .plate .tag.human { background:#b7791f; } .plate .tag.random { background:#666; }
  .plate .tag.dealer { background:#b03a2e; }
  .seat.active .plate { box-shadow:0 0 0 2px var(--gold); }

  .tiles { display:flex; gap:2px; flex-wrap:wrap; }
  .tiles.col { flex-direction:column; flex-wrap:nowrap; }
  .tile { display:inline-flex; align-items:center; justify-content:center; width:30px; height:42px; border-radius:4px;
          background:linear-gradient(#fffdf7,#efe9dc); border:1px solid #b9b2a3; border-bottom:4px solid #2e8b57; font-weight:700; font-size:14px; }
  .tile.sm { width:22px; height:31px; border-bottom-width:3px; font-size:11px; }
  .tile.m { color:var(--m); } .tile.s { color:var(--s); } .tile.p { color:var(--p); } .tile.z { color:var(--z); }
  .tile.back { background:linear-gradient(#2f9e5b,#1f7a43); border-color:#145a32; border-bottom-color:#0e3d22; }
  .tile.draw { margin-left:10px; }
  .tile.hl { outline:3px solid #ff5252; outline-offset:-1px; }
  .tile.click { cursor:pointer; transition:transform .08s; }
  .tile.click:hover { transform:translateY(-6px); }
  .meld { display:flex; gap:1px; padding:2px 3px; background:rgba(0,0,0,.25); border-radius:4px; }
  .melds { display:flex; gap:6px; }
  .melds.col { flex-direction:column; }
  .river { display:grid; grid-template-columns:repeat(6, 24px); gap:2px; min-height:33px; }
  .river.col { grid-template-columns:none; grid-template-rows:repeat(6, 33px); grid-auto-flow:column; grid-auto-columns:24px; min-height:0; min-width:24px; }
  .handrow { display:flex; align-items:flex-end; gap:8px; }
  .handrow.col { flex-direction:column; align-items:center; }

  /* ---------- 右侧面板 ---------- */
  aside { display:grid; gap:12px; align-content:start; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
  .panel h3 { margin:0 0 8px; font-size:14px; color:#fff; }
  .muted { color:var(--muted); font-size:12px; }
  .bar { display:grid; grid-template-columns:28px 1fr 52px; gap:8px; align-items:center; margin:3px 0; }
  .bar .track { height:16px; background:#1a1c21; border-radius:3px; overflow:hidden; }
  .bar .fill { height:100%; background:#3498db; }
  .bar.chosen .fill { background:#e74c3c; }
  .bar .pct { text-align:right; font-variant-numeric:tabular-nums; font-size:13px; }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  td, th { padding:2px 6px; text-align:right; border-bottom:1px solid var(--line); }
  td:first-child, th:first-child { text-align:left; }
  tr.best td { background:rgba(230,180,34,.15); }
  .result { font-size:16px; font-weight:700; color:#ffb74d; margin-top:6px; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; }
  .advice { font-size:13px; margin-top:6px; padding:6px 8px; background:#1a1c21; border-radius:6px; }
</style>
</head>
<body>
<header>
  <label>seed <input id="seed" type="number" value="0"></label>
  <label>模式 <select id="mode"><option value="god">上帝视角</option><option value="player">玩家视角</option></select></label>
  <label>座位 <select id="seat"><option>0</option><option>1</option><option>2</option><option>3</option></select></label>
  <label><input id="human" type="checkbox"> 我来打（玩家视角）</label>
  <button id="new" class="primary">新局</button>
  <button id="rand">随机新局</button>
  <button id="step">下一步</button>
  <button id="step10">快进 10 步</button>
  <button id="auto">自动播放</button>
  <button id="end">跳到结束</button>
  <span id="status"></span>
</header>
<main>
  <div class="table" id="table"></div>
  <aside id="aside"></aside>
</main>
<script>
const HONORS = ["东","南","西","北","中","发","白"];
const WINDS = ["东","南","西","北"];
const ui = { mode:"god", seat:0, human:false, auto:null, st:null };

function tileInfo(t){ if(t>=27) return {txt:HONORS[t-27], cls:"z"}; const n=t%9+1, k=Math.floor(t/9); return {txt:n+"万条筒"[k], cls:"msp"[k]}; }
function tile(t, cls=""){ if(t<0) return `<span class="tile back ${cls}"></span>`; const i=tileInfo(t); return `<span class="tile ${i.cls} ${cls}" data-t="${t}">${i.txt}</span>`; }
function tiles(arr, cls="", col=false){ return `<span class="tiles ${col?"col":""}">${arr.map(t=>tile(t,cls)).join("")}</span>`; }
const viewParam = () => ui.mode==="player" ? `view=${ui.seat}` : "view=";
const api = async (path, method="GET") => (await fetch(path + (path.includes("?")?"&":"?") + viewParam(), {method})).json();

function seatHtml(st, p, pos){
  const pl = st.players[p];
  const active = st.to_act.includes(p);
  const hidden = pl.hand.length===0 && pl.hand_size>0;
  const isDrawTurn = st.phase==="DISCARD" && st.current===p && st.last_draw>=0;
  const clickable = st.waiting_human && st.human===p && st.phase==="DISCARD";
  const side = pos==="left" || pos==="right";
  const big = pos==="bottom";
  const tcls = big ? "" : "sm";

  // 手牌
  let hand = hidden ? Array(pl.hand_size).fill(-1) : [...pl.hand];
  let drawHtml = "";
  if (isDrawTurn && !hidden){ const k=hand.indexOf(st.last_draw); if(k>=0) hand.splice(k,1); drawHtml = tile(st.last_draw, tcls+" draw"+(clickable?" click":"")); }
  else if (isDrawTurn && hidden){ hand.pop(); drawHtml = tile(-1, tcls+" draw"); }
  const handHtml = tiles(hand, tcls+(clickable?" click":""), side);
  const melds = pl.melds.map(m=>`<span class="meld">${tiles(Array(m.type==="PON"?3:4).fill(m.tile),"sm",side)}</span>`).join("");
  const meldsHtml = melds ? `<span class="melds ${side?"col":""}">${melds}</span>` : "";
  // 牌河：RESPOND 阶段最后一张高亮
  const river = pl.river.map((t,k)=>tile(t,"sm"+(st.phase==="RESPOND"&&st.current===p&&k===pl.river.length-1?" hl":""))).join("");
  const riverHtml = `<span class="river ${side?"col":""}">${river}</span>`;

  const wind = WINDS[(p - st.dealer + 4) % 4];
  const sh = pl.shanten==null ? "" : pl.shanten<0 ? "胡" : pl.shanten===0 ? "听牌" : pl.shanten+"向听";
  const plate = `<span class="plate"><span><b>玩家${p}</b> <span class="tag ${pl.agent}">${pl.agent}</span>
     ${st.dealer===p?'<span class="tag dealer">庄</span>':""} <span>${wind}</span></span>
     <span class="muted">${sh}${active?" · 决策中":""}</span></span>`;

  let body;
  if (pos==="bottom") body = `${riverHtml}<span class="handrow">${handHtml}${drawHtml}${meldsHtml}</span>`;
  else if (pos==="top") body = `<span class="handrow">${handHtml}${drawHtml}${meldsHtml}</span>${riverHtml}`;
  else if (pos==="left") body = `<span class="handrow col">${handHtml}${drawHtml}${meldsHtml}</span>${riverHtml}`;
  else body = `<span class="handrow col">${handHtml}${drawHtml}${meldsHtml}</span>${riverHtml}`;
  return `<div class="seat ${pos} ${active?"active":""}" data-p="${p}">${plate}${body}</div>`;
}

function renderTable(st){
  const el = document.getElementById("table");
  const bottom = ui.seat;
  const pos = ["bottom","right","top","left"]; // 相对座位：自己 / 下家 / 对家 / 上家
  let html = "";
  for (let rel=0; rel<4; rel++){ const p=(bottom+rel)%4; html += seatHtml(st, p, pos[rel]); }
  const cur = st.finished ? -1 : st.to_act[0];
  const windAt = (rel)=>{ const p=(bottom+rel)%4; return `<span class="wind ${cur===p?"on":""}">${WINDS[(p-st.dealer+4)%4]}</span>`; };
  html += `<div class="center"><div class="hub">
     <span></span>${windAt(2)}<span></span>
     ${windAt(3)}<div style="text-align:center"><div class="wall">${st.wall}</div><div class="sub">剩余牌 · ${st.phase}</div>
       <div class="sub">${st.last_action?`玩家${st.last_action.player} ${st.last_action.type}${st.last_action.tile>=0?" "+tileInfo(st.last_action.tile).txt:""}`:"开局"}</div></div>${windAt(1)}
     <span></span>${windAt(0)}<span></span></div></div>`;
  el.innerHTML = html;
  if (st.waiting_human && st.phase==="DISCARD"){
    el.querySelectorAll(`.seat[data-p="${st.human}"] .tile.click`).forEach(t => t.onclick = ()=> act("DISCARD", +t.dataset.t));
  }
}

function renderAside(st){
  const el = document.getElementById("aside");
  const a = st.analysis;
  let html = "";
  if (st.result) html += `<div class="panel"><h3>结果</h3><div class="result">${st.result.text}</div></div>`;
  if (st.waiting_human && a){
    html += `<div class="panel"><h3>轮到你了（玩家${st.human}）</h3>`;
    if (a.phase==="DISCARD") html += `<div class="muted">点击手牌打出</div>`;
    const btns = a.legal.filter(x=>x.type!=="DISCARD").map(x=>`<button class="${x.type==="PASS"?"":"danger"}" onclick="act('${x.type}',${x.tile})">${({TSUMO:"自摸",RON:"胡",PON:"碰",KAN:"杠",ANKAN:"暗杠",ADDKAN:"加杠",PASS:"过"})[x.type]}${x.tile>=0&&x.type!=="PASS"?" "+tileInfo(x.tile).txt:""}</button>`);
    if (btns.length) html += `<div class="actions" style="margin-top:6px">${btns.join("")}</div>`;
    html += `</div>`;
  }
  if (a && a.nn){
    const top = a.nn[0];
    html += `<div class="panel"><h3>神经网络：玩家${a.player} 打哪张？</h3>`;
    html += a.nn.map(r=>`<div class="bar ${r===top?"chosen":""}">${tile(r.tile,"sm")}<div class="track"><div class="fill" style="width:${(r.p*100).toFixed(1)}%"></div></div><span class="pct">${(r.p*100).toFixed(1)}%</span></div>`).join("");
    if (a.rule) { const rb=a.rule.find(r=>r.tile===a.rule_pick)||a.rule[0]; html += `<div class="advice">建议：网络 <b>${tileInfo(top.tile).txt}</b>（${(top.p*100).toFixed(0)}%） · 规则 <b>${tileInfo(rb.tile).txt}</b>（${rb.shanten} 向听 / ${rb.effective} 进张）${top.tile===rb.tile?" · 一致":" · <span style='color:#ffb74d'>不一致</span>"}</div>`; }
    html += `</div>`;
  }
  if (a && a.rule){
    html += `<div class="panel"><h3>规则分析（向听 / 进张）</h3><div class="muted">当前 ${a.shanten<0?"已胡":a.shanten+" 向听"}</div><table><tr><th>打</th><th>向听</th><th>进张</th></tr>`;
    html += a.rule.slice(0,8).map((r,k)=>`<tr class="${r.tile===a.rule_pick?"best":""}"><td>${tile(r.tile,"sm")}</td><td>${r.shanten}</td><td>${r.effective}</td></tr>`).join("");
    html += `</table></div>`;
  }
  if (a && a.phase==="RESPOND" && !st.waiting_human){
    html += `<div class="panel"><h3>响应：玩家${a.player}</h3>可选：${a.legal.map(x=>x.type).join(" / ")}</div>`;
  }
  if (!html) html = `<div class="panel muted">${st.finished?"本局结束":"AI 正在行动…"}</div>`;
  el.innerHTML = html;
}

function render(st){
  ui.st = st;
  if(!st.started){ document.getElementById("status").textContent="未开局"; return; }
  renderTable(st); renderAside(st);
  document.getElementById("status").textContent = st.finished ? "已结束" : st.waiting_human ? "等你出牌" : `轮到玩家${st.to_act[0]}`;
  if (st.finished && ui.auto) toggleAuto();
}

async function act(type, tile){ render(await api(`/api/act?player=${ui.seat}&type=${type}&tile=${tile}`, "POST")); }
function readControls(){ ui.mode=document.getElementById("mode").value; ui.seat=+document.getElementById("seat").value; ui.human=document.getElementById("human").checked && ui.mode==="player"; }
function toggleAuto(){
  const b = document.getElementById("auto");
  if (ui.auto){ clearInterval(ui.auto); ui.auto=null; b.textContent="自动播放"; return; }
  b.textContent="停止"; ui.auto = setInterval(async()=>{ const st=await api("/api/step","POST"); render(st); }, 650);
}

async function newGame(){ readControls(); render(await api(`/api/new?seed=${document.getElementById("seed").value}&human=${ui.human?ui.seat:-1}`,"POST")); }
document.getElementById("new").onclick = newGame;
document.getElementById("rand").onclick = ()=>{ document.getElementById("seed").value = Math.floor(Math.random()*1e6); newGame(); };
document.getElementById("step").onclick = async()=> render(await api("/api/step","POST"));
document.getElementById("step10").onclick = async()=> render(await api("/api/step?n=10","POST"));
document.getElementById("end").onclick = async()=> render(await api("/api/step?n=1000","POST"));
document.getElementById("auto").onclick = toggleAuto;
for (const id of ["mode","seat"]) document.getElementById(id).onchange = async()=>{ readControls(); render(await api("/api/state")); };
readControls(); api("/api/state").then(render);
</script>
</body>
</html>
